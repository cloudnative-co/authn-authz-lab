name: auth-authz-sample

# Integration environment for the "concept model -> real protocol" chapters:
#   ldap        06  OpenLDAP directory (RFC 4511)
#   kdc / app / kdc-client
#               07  MIT Kerberos KDC + SPNEGO acceptor + curl --negotiate client
#   keycloak    09  SAML 2.0 IdP
#   samba-ad    08  Samba Active Directory DC (opt-in `--profile ad`)
#
# Bring up with:  npm run compose:up   (docker compose up -d --build --wait)

services:
  ldap:
    build: ./docker/ldap
    ports:
      - "1389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=test", "-s", "base"]
      interval: 5s
      timeout: 5s
      retries: 15

  kdc:
    build: ./docker/kdc
    hostname: kdc
    volumes:
      - ./docker/kdc/krb5.conf:/etc/krb5.conf:ro
      - keytabs:/keytabs
    healthcheck:
      test: ["CMD", "test", "-f", "/keytabs/http.keytab"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    hostname: app.example.test
    networks:
      default:
        aliases:
          - app.example.test
    environment:
      KRB5_KTNAME: /keytabs/http.keytab
      KERBEROS_SERVICE_PRINCIPAL: HTTP@app.example.test
    volumes:
      - ./docker/kdc/krb5.conf:/etc/krb5.conf:ro
      - keytabs:/keytabs:ro
    depends_on:
      kdc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/me').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  kdc-client:
    build: ./docker/kdc-client
    volumes:
      - ./docker/kdc/krb5.conf:/etc/krb5.conf:ro
    depends_on:
      kdc:
        condition: service_healthy
      app:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8085:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # Opt-in Active Directory DC for chapter 08 (docker compose --profile ad up).
  # Not wired into the app; exercised with samba-tool / ldapsearch / kinit.
  samba-ad:
    build: ./docker/samba-ad
    profiles: ["ad"]
    hostname: dc1
    privileged: true
    ports:
      - "1636:389"
    environment:
      AD_REALM: AD.EXAMPLE.TEST
      AD_DOMAIN: AD
      AD_ADMIN_PASSWORD: Passw0rd!

volumes:
  keytabs:
