    {
      "id": "AA10-X3",
      "prompt": "refresh token、PAR、DPoP、mTLSのうち一つを選び、軽減する脅威と新しい鍵・運用負荷を整理する",
      "acceptance": "機能名の列挙ではなく、適用する攻撃経路、所有者、rotation、失敗時の復旧がある"
