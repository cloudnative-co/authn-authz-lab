    "type": "automated-track-simulation-and-instructor-rubric",
    "evidence": "架空組織の同一caseに対し、developerまたはiam-operationsの構造化成果物をfresh simulatorへ入力し、責任分界、credential/JML、federation、API認可、MFA/Passkey、優先リスク、track統合の7 check、5重大拒否test、未解決Criticalを検証する。自由記述の意味理解は自動判定せず講師rubricへ分離する",
    "passCriteria": "選択した1trackでAA-CAP-C1からAA-CAP-C7が全件pass、機械採点100点中80点以上、重大拒否test skip 0かつfailure 0、未解決Critical 0を満たす。加えて学校・社内研修の修了判定では講師が自由記述rubricを80%以上で採点する",
    "labTask": {
      "instructionsRef": "course/lessons/capstone/README.md",
      "predict": "架空組織の5 observationから責任owner、3 Critical、拒否順、JML・緊急失効・MFA/Passkey recoveryの期待結果を予測し、developerまたはiam-operationsを1つ選ぶ",
      "execute": "doctor、setup、demo、observe後にsubmission.jsonの共通controlと選択trackのpolicyまたはrunbookを編集し、5重大testをrunにしてcheckする",
      "rejectOrFail": "critical controlを1つ外す、重大testをskipする、Criticalを未解決にする、token→scope→tenant→object順を崩す、SAML semantic validationやleaver/recovery revocationを欠くとfresh checkがfailすることを確認する",
      "evidence": "AA-CAP-C1からC7、scorePercent、criticalSkipCount、criticalFailureCount、unresolvedCriticalがfresh checkでpassし、credential、PII、raw token、filesystem pathを含まないevidenceIdを確認する",
      "practicalTransfer": "講師rubricで責任分界、代替案、残存risk、実装または運用上のtradeoffを説明し、自組織へ持ち帰る90日計画を別途レビューする"
    },
    "rubric": {
      "scoringMethod": "all-required-checks",
      "passRule": "機械判定は全7 check、80%以上、重大拒否skip/failure 0、未解決Critical 0をすべて要求する。自由記述は機械判定に混ぜずinstructor-guide.mdのrubricで別採点する",
      "failureRule": "いずれかのrequired check不一致、80%未満、重大拒否のskipまたはfailure、未解決Critical、track不整合、TODO・未知field・未知値があれば機械判定は不合格。講師rubricが80%未満なら研修修了は保留する"
