    {
      "id": "AA03-X2",
      "prompt": "複数instance・複数regionでのlogout、管理者失効、権限変更後の反映を設計し、遅延と障害時の挙動を示す",
      "acceptance": "client側Cookie削除だけを失効とせず、cache不整合、fail-open可否、最大反映時間を明記している"
    },
    {
      "id": "AA03-X3",
      "prompt": "session anomalyの監査とincident対応を設計し、追跡に必要な識別子、秘匿、保存期間、強制失効手順を記録する",
      "acceptance": "生のSession IDやCookieをlogへ残さず、相関可能な非secret IDと全失効後の確認方法がある"
    }
  ],
  "evidenceBoundary": {
