name: Course quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-and-browser:
    name: Node ${{ matrix.node }} and Chromium (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 24
            playwright_install: npx playwright install --with-deps chromium
          - os: ubuntu-24.04
            node: 26
            playwright_install: npx playwright install --with-deps chromium
          - os: macos-15
            node: 24
            playwright_install: npx playwright install chromium
          - os: macos-15
            node: 26
            playwright_install: npx playwright install chromium
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ matrix.node }}.x"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: ${{ matrix.playwright_install }}

      - name: Verify generated course contract
        run: node scripts/sync-course-contract.mjs --check

      - name: Run course, unit, browser, and lifecycle tests
        run: npm test

      - name: Audit high-severity dependency advisories
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

  docker-protocols:
    name: Docker protocol integration (Node 24, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Diagnose Docker prerequisites
        run: |
          docker version
          docker compose version

      - name: Run LDAP, Kerberos, Samba AD, and SAML integration tests
        run: npm run test:integration
