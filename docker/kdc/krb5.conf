[libdefaults]
    default_realm = EXAMPLE.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    ticket_lifetime = 24h
    forwardable = true

[realms]
    EXAMPLE.TEST = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .example.test = EXAMPLE.TEST
    example.test = EXAMPLE.TEST
    app.example.test = EXAMPLE.TEST
